name: Build Cross-Platform Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10 (macOS / Windows)
      if: runner.os != 'Linux'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (macOS / Windows)
      if: runner.os != 'Linux'
      run: |
        python -m pip install --upgrade pip
        pip install "kerykeion>=4.18.5,<5.0.0" PyQt5 PyQtWebEngine geopy timezonefinder pyswisseph pyinstaller

    - name: Build Executable (Linux, pinned ubuntu:22.04 container)
      if: runner.os == 'Linux'
      run: docker run --rm -v "$PWD":/work -w /work ubuntu:22.04 bash linux_build.sh

    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ -f astrology_icon.png ]; then
          pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" --add-data "astrology_icon.png:." --hidden-import PyQt5.QtWebEngineWidgets --collect-data kerykeion --collect-data certifi AstroCharter.py
        else
          pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" --hidden-import PyQt5.QtWebEngineWidgets --collect-data kerykeion --collect-data certifi AstroCharter.py
        fi

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        if (Test-Path astrology_icon.png) {
          pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" --add-data "astrology_icon.png;." --hidden-import PyQt5.QtWebEngineWidgets --collect-data kerykeion --collect-data certifi AstroCharter.py
        } else {
          pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" --hidden-import PyQt5.QtWebEngineWidgets --collect-data kerykeion --collect-data certifi AstroCharter.py
        }

    - name: Rename per OS
      shell: bash
      run: |
        cd dist
        if [ "${{ runner.os }}" = "Windows" ]; then
          mv AstrologyChartGenerator.exe AstrologyChartGenerator-Windows.exe
        elif [ "${{ runner.os }}" = "macOS" ]; then
          mv AstrologyChartGenerator AstrologyChartGenerator-macOS
        else
          mv AstrologyChartGenerator AstrologyChartGenerator-Linux
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AstrologyChartGenerator-${{ matrix.os }}
        path: dist/

    - name: Publish to GitHub Release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN || github.token }}
        files: dist/*
        generate_release_notes: true
