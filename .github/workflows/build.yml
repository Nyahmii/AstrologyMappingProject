name: Build Cross-Platform Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger it manually from the GitHub website

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 PyQtWebEngine kerykeion geopy timezonefinder pyinstaller

    # Linux and Mac use a colon (:) for add-data
    - name: Build Executable (Linux/Mac)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" \
        --add-data "astrology_icon.png:." \
        --hidden-import PyQt5.QtWebEngineWidgets \
        --collect-data kerykeion \
        AstroCharter.py

    # Windows uses a semicolon (;) for add-data
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AstrologyChartGenerator" `
        --add-data "astrology_icon.png;." `
        --hidden-import PyQt5.QtWebEngineWidgets `
        --collect-data kerykeion `
        AstroCharter.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: AstrologyChartGenerator-${{ matrix.os }}
        path: dist/
